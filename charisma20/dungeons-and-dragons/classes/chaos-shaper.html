n’t cast if you have moved this turn.</p><p style=\"margin-left:24px\"><b><i>Injured.</i></b> Casting a spell halves your Speed until the end of the turn, and you can’t cast if you have moved more than half your Speed this turn.</p><p style=\"margin-left:24px\"><b><i>Reeling.</i></b> Casting a spell halves your Speed until the end of the turn. If you moved more than half your Speed earlier in the turn, roll a d6 after casting: on a 3 or lower, you take half the spell’s damage, or the spell fails if it deals none.</p><div class=\"tw\"><table><thead><tr><th>Spell Level</th><th>Healthy</th><th>Injured</th><th>Reeling</th></tr></thead><tbody><tr><td>Cantrip</td><td>Eldritch Blast, Chill Touch, Poison Spray, Mage Hand</td><td>&mdash;</td><td>&mdash;</td></tr><tr><td>1st</td><td>&mdash;</td><td>Magic Missile, Shield</td><td>Cure Wounds, Hellish Rebuke</td></tr><tr><td>2nd</td><td>&mdash;</td><td>Misty Step, Scorching Ray</td><td>Hold Person, Spiritual Weapon</td></tr><tr><td>3rd</td><td>&mdash;</td><td>Counterspell, Fireball</td><td>Haste, Spirit Guardians</td></tr><tr><td>4th</td><td>&mdash;</td><td>Dimension Door, Greater Invisibility</td><td>Banishment, Death Ward</td></tr><tr><td>5th</td><td>&mdash;</td><td>Cone of Cold, Wall of Force</td><td>Flame Strike, Mass Cure Wounds</td></tr></tbody></table></div>"
