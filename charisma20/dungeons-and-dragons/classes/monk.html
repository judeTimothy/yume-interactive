window.C20_PAGE=
{
 kind:"class", slug:"monk", name:"Monk", color:"#3e8080",
 source:"Player's Handbook (2024)",
 intro:["Monks use rigorous combat training and mental discipline to align themselves with the multiverse and focus their internal reservoirs of power. Different Monks conceptualize this power in various ways: as breath, energy, life force, essence, or self, for example. Whether channeled as a striking display of martial prowess or as a subtler manifestation of defense and speed, this power infuses all that a Monk does. Monks focus their internal power to create extraordinary, even supernatural, effects. They channel uncanny speed and strength into their attacks, with or without the use of weapons. In a Monk’s hands, even the most basic weapons can become sophisticated implements of combat mastery. Many Monks find that a structured life of ascetic withdrawal helps them cultivate the physical and mental focus they need to harness their power. Other Monks believe that immersing themselves in the vibrant confusion of life helps to fuel their determination and discipline. Monks generally view adventures as tests of their physical and mental development. They are driven by a desire to accomplish a greater mission than merely slaying monsters and plundering treasure; they strive to turn themselves into living weapons."],
 core:[["Primary Ability","Dexterity and Wisdom"],["Hit Point Die","D8 per Monk level"],["Saving Throw Proficiencies","Strength and Dexterity"],["Skill Proficiencies","Choose 2: Acrobatics, Athletics, History, Insight, Religion, or Stealth"],["Weapon Proficiencies","Simple weapons and Martial weapons that have the Light property"],["Armor Training","None"]],
 features:[
  [1,"Martial Arts",
  `<p>Your practice of martial arts gives you mastery of combat styles that use your Unarmed Strike and Monk weapons, which are the following:</p>
   <ul>
          <li>Simple Melee weapons</li>
          <li>Martial Melee weapons that have the Light property</li>
   </ul>
   <p>You gain the following benefits while you are unarmed or wielding only Monk weapons and you aren’t wearing armor or wielding a Shield.</p>
   <p><b><i>Bonus Unarmed Strike. </i></b>You can make an Unarmed Strike as a Bonus Action.</p>
   <p><b><i>Martial Arts Die. </i></b>You can roll 1d6 in place of the normal damage of your Unarmed Strike or Monk weapons. This die changes as you gain Monk levels, as shown in the Martial Arts column of the Monk Features table.</p>
   <p><b><i>Dexterous Attacks. </i></b>You can use your Dexterity modifier instead of your Strength modifier for the attack and damage rolls of your Unarmed Strikes and Monk weapons. In addition, when you use the Grapple or Shove option of your Unarmed Strike, you can use your Dexterity modifier instead of your Strength modifier to determine the save DC.</p>
  `],
  [1,"Unarmored Defense", "While you aren’t wearing armor or wielding a Shield, your base Armor Class equals 10 plus your Dexterity and Wisdom modifiers."],
  [2,"Monk's Focus", 
  `<p>Your focus and martial training allow you to harness a well of extraordinary energy within yourself. This energy is represented by Focus Points. Your Monk level determines the number of points you have, as shown in the Focus Points column of the Monk Features table.</p>
  <p>You can expend these points to enhance or fuel certain Monk features. You start knowing three such features: Flurry of Blows, Patient Defense, and Step of the Wind, each of which is detailed below.</p>
  <p>When you expend a Focus Point, it is unavailable until you finish a Short or Long Rest, at the end of which you regain all your expended points.</p>
  <p>Some features that use Focus Points require your target to make a saving throw. The save DC equals 8 plus your Wisdom modifier and Proficiency Bonus.</p>
  <p><b><i>Flurry of Blows. </i></b>You can expend 1 Focus Point to make two Unarmed Strikes as a Bonus Action.</p>
  <p><b><i>Patient Defense. </i></b>You can take the Disengage action as a Bonus Action. Alternatively, you can expend 1 Focus Point to take both the Disengage and the Dodge actions as a Bonus Action.</p>
  <p><b><i>Step of the Wind. </i></b>You can take the Dash action as a Bonus Action. Alternatively, you can expend 1 Focus Point to take both the Disengage and Dash actions as a Bonus Action, and your jump distance is doubled for the turn.</p>
  `],
  [2,"Unarmored Movement", "Your speed increases by 10 feet while you aren’t wearing armor or wielding a Shield. This bonus increases when you reach certain Monk levels, as shown on the Monk Features table."],
  [2,"Uncanny Metabolism", "When you roll Initiative, you can regain all expended Focus Points. When you do so, roll your Martial Arts die, and regain a number of Hit Points equal to your Monk level plus the number rolled. Once you use this feature, you can’t use it again until you finish a Long Rest."],
  [3,"Monk Subclass","You gain a Monk subclass of your choice. A subclass is a specialization that grants you features at certain Monk levels. For the rest of your career, you gain each of your subclass’s features that are of your Monk level or lower."],
  [3,"Deflect Attacks",
  `<p>When an attack roll hits you and its damage includes Bludgeoning, Piercing, or Slashing damage, you can take a Reaction to reduce the attack’s total damage against you. The reduction equals 1d10 plus your Dexterity modifier and Monk level.</p>
  <p>If you reduce the damage to 0, you can expend 1 Focus Point to redirect some of the attack’s force. If you do so, choose a creature you can see within 5 feet of yourself if the attack was a melee attack or a creature you can see within 60 feet of yourself that isn’t behind Total Cover if the attack was a ranged attack. That creature must succeed on a Dexterity saving throw or take damage equal to two rolls of your Martial Arts die plus your Dexterity modifier. The damage is the same type dealt by the attack.</p>
  `],
  [4,"Ability Score Improvement", "You gain the Ability Score Improvement feat or another feat of your choice for which you qualify. You gain this feature again at Monk levels 8, 12, and 16."],
  [4, "Slow Fall", "You can take a Reaction when you fall to reduce any damage you take from the fall by an amount equal to five times your Monk level."],
  [5,"Extra Attack", "You can attack twice instead of once whenever you take the Attack action on your turn."],
  [5,"Stunning Strike", "Once per turn when you hit a creature with a Monk weapon or an Unarmed Strike, you can expend 1 Focus Point to attempt a stunning strike. The target must make a Constitution saving throw. On a failed save, the target has the Stunned condition until the start of your next turn. On a successful save, the target’s Speed is halved until the start of your next turn, and the next attack roll made against the target before then has Advantage."],
  [6,"Empowered Strikes", "Whenever you deal damage with your Unarmed Strike, it can deal your choice of Force damage or its normal damage type."],
  [6, "Subclass Feature"]
  [7,"Evasion", "When you’re subjected to an effect that allows you to make a Dexterity saving throw to take only half damage, you instead take no damage if you succeed on the saving throw and only half damage if you fail. You don’t benefit from this feature if you have the Incapacitated condition."],
  [8, "Ability Score Improvement"]
  [9,"Acrobatic Movement", "While you aren’t wearing armor or wielding a Shield, you gain the ability to move along vertical surfaces and across liquids on your turn without falling during the movement."],
  [10,"Heightened Focus",
    `<p>Your Flurry of Blows, Patient Defense, and Step of the Wind gain the following benefits.</p>
  <p><b><i>Flurry of Blows. </i></b>You can expend 1 Focus Point to use Flurry of Blows and make three Unarmed Strikes with it instead of two.</p>
  <p><b><i>Patient Defense. </i></b>When you expend a Focus Point to use Patient Defense, you gain a number of Temporary Hit Points equal to two rolls of your Martial Arts die.</p>
  <p><b><i>Step of the Wind. </i></b>When you expend a Focus Point to use Step of the Wind, you can choose a willing creature within 5 feet of yourself that is Large or smaller. You move the creature with you until the end of your turn. The creature’s movement doesn’t provoke Opportunity Attacks.</p>
  `],
  [10,"Self Restoration",
  `<p>Through sheer force of will, you can remove one of the following conditions from yourself at the end of each of your turns: Charmed, Frightened, or Poisoned.</p>
  <p>In addition, forgoing food and drink doesn’t give you levels of Exhaustion.</p>
  `],
  [12,"Ability Score Improvement"],
  [13, "Deflect Energy", "You can now use your Deflect Attacks feature against attacks that deal any damage type, not just Bludgeoning, Piercing, or Slashing"],
  [14,"Disciplined Survivor",
    `<p>Your physical and mental discipline grant you proficiency in all saving throws.</p>
    <p>Additionally, whenever you make a saving throw and fail, you can expend 1 Focus Point to reroll it, and you must use the new roll.</p>
  `],
  [11,"Subclass Feature"],
  [15,"Perfect Focus","When you roll Initiative and don’t use Uncanny Metabolism, you regain expended Focus Points until you have 4 if you have 3 or fewer."],
  [16,"Ability Score Improvement"],
  [17,"Improved Brutal Strike", "The extra damage of your Brutal Strike increases to 2d10. In addition, you can use two different Brutal Strike effects whenever you use your Brutal Strike feature."],
  [17,"Subclass Feature"],
  [18,"Superior Defense", "At the start of your turn, you can expend 3 Focus Points to bolster yourself against harm for 1 minute or until you have the Incapacitated condition. During that time, you have Resistance to all damage except Force damage."],
  [19,"Epic Boon", "You gain an Epic Boon feat or another feat of your choice for which you qualify."],
  [20,"Body and Mind","You have developed your body and mind to new heights. Your Dexterity and Wisdom scores increase by 4, to a maximum of 25."]
 ],
  subclasses:[
  { name:"Warrior of the Open Hand",
    label:"Player’s Handbook (2024)",
    intro:["Warriors of the Open Hand are masters of unarmed combat. They learn techniques to push and trip their opponents and manipulate their own energy to protect themselves from harm."],
    features:[
     [3,"Open Hand Technique", 
     `<p>Whenever you hit a creature with an attack granted by your Flurry of Blows, you can impose one of the following effects on that target.</p>
     <p><b><i>Addle. </i></b>The target can’t make Opportunity Attacks until the start of its next turn.</p>
     <p><b><i>Push. </i></b>The target must succeed on a Strength saving throw or be pushed up to 15 feet away from you.</p>
     <p><b><i>Topple. </i></b> The target must succeed on a Dexterity saving throw or have the Prone condition.</p>
     `],
     [6,"Wholeness of Body", 
     `<p>You gain the ability to heal yourself. As a Bonus Action, you can roll your Martial Arts die. You regain a number of Hit Points equal to the number rolled plus your Wisdom modifier (minimum of 1 Hit Point regained).</p>
     <p>You can use this feature a number of times equal to your Wisdom modifier (minimum of once), and you regain all expended uses when you finish a Long Rest.</p>
     `],
     [11,"Fleet Step", "When you take a Bonus Action other than Step of the Wind, you can also use Step of the Wind immediately after that Bonus Action."],
     [17,"Quivering Palm",
      `<p>You gain the ability to set up lethal vibrations in someone’s body. When you hit a creature with an Unarmed Strike, you can expend 4 Focus Points to start these imperceptible vibrations, which last for a number of days equal to your Monk level. The vibrations are harmless unless you take an action to end them. Alternatively, when you take the Attack action on your turn, you can forgo one of the attacks to end the vibrations. To end them, you and the target must be on the same plane of existence. When you end them, the target must make a Constitution saving throw, taking 10d12 Force damage on a failed save or half as much damage on a successful one.</p>
      <p>You can have only one creature under the effect of this feature at a time. You can end the vibrations harmlessly (no action required).</p>
     `]
    ]
  },
   { name:"Warrior of the Eight Limbs",
    label:"The World of Ossyra (2024)",
    intro:["Warriors of the Eight Limbs are masters of the ring tradition of unarmed combat, using fists, elbows, knees and shins as weapons. They learn to throw their opponents off balance, hold them in a clinch, and chain their strikes to keep the action going."],
    features:[
     [3,"Art of the Eight Limbs", 
     `<p>Your Flurry of Blows becomes a precise sequence of techniques that use all eight limbs. Your Eight Limbs save DC equals 8 plus your Wisdom modifier and Proficiency Bonus.</p>
     <p>When you hit a creature with an attack granted by your Flurry of Blows, you can impose one of the following effects on it.</p>
     <p><b><i>Dazing Strike. </i></b>You drive a push kick straight into the target's diaphragm, dazing the target. The target must succeed on a Constitution saving throw against your Eight Limbs save DC. On a failed save, it can only take either an Action or Bonus Action on its turn, not both. Additionally, the target cannot take Reactions.</p>
     <p><b><i>Piercing Strike. </i></b>You drive an elbow into the target. The target must succeed on a Constitution saving throw against your Eight Limbs save DC or begin Bleeding. A Bleeding creature takes 1d4 Piercing damage at the start of each of its turns for 2 rounds, and the effect ends early if it receives magical healing. Hitting the same creature with another Piercing Strike while it is Bleeding resets the duration.</p>
     <p><b><i>Joint Breaker. </i></b>You kick the target's knees. The target must make a Constitution saving throw against your Eight Limbs save DC. On a failed save, its Speed is halved and it has Disadvantage on Dexterity saving throws until the end of its next turn.</p>
     `],
     [3, "Rhythm of the Ring",
      `<p>When two or more attacks of a single Flurry of Blows hit the same target, you can immediately choose one of the following options at no Focus Point of Bonus Action cost:</p>
      <ul>
            <li>Make one additional Unarmed Strike against the target.</li>
            <li>Attempt to Clinch the target.</li>
      </ul>
      <p>You can use Rhythm of the Ring only once on each of your turns.</p>
      <p><b><i>Clinch. </i></b>The target must succeed on a Strength saving throw against your Eight Limbs save DC or you and the target are Clinched. While Clinched, you and the target are locked together and must stay within 5 feet of each other. Both of you can take Actions, Bonus Actions, and Reactions normally, and the target has Disadvantage on attack rolls against creatures other than you.</p>
      <p>When either of you moves, the mover can choose to keep the Clinch by pulling the other creature along: you each make a Strength (Athletics) check, contested. If the mover wins, the other creature moves with them and stays adjacent. If the mover loses or chooses not to pull, the Clinch ends.</p>
      <p>You can also use a Bonus Action to slam the Clinched enemy. The target must succeed on a Strength saving throw against your Eight Limbs save DC or take Unarmed Strike damage and be knocked Prone. This ends the Clinch.</p>
      <p>A creature can also use its action to break free, making a Strength (Athletics) check against your Eight Limbs save DC. You can end the Clinch at any time (no action required). It also ends if either of you are Incapacitated.</p>
      `]
     [6,"Ring Conditioning", 
     `<p>Your conditioning and mastery of pain let you dominate the battlefield with an aggressive presence and rapid retaliation. You have Advantage on Charisma (Intimidation) checks.</p>
     <p>When an effect would impose the Incapacitated, Paralyzed, Prone, or Stunned condition on you, you can take a Reaction and expend 2 Focus Points to resist that effect, preventing the condition from affecting you. You can then make one Unarmed Strike against the creature that imposed the condition, provided it is within your reach.</p>
     <p>Once you use this feature, you can't use it again until you finish a Short or Long Rest.</p>
     `],
     [11,"Unbroken Rhythm", "Your strikes flow together, turning every attack into an opening for the next. Rhythm of the Ring now triggers whenever two or more of your Unarmed Strikes hit the same target on your turn, not only attacks from Flurry of Blows. You can still use it only once on each of your turns, and the extra Unarmed Strike it grants can't trigger it again."],
     [17,"Champion's Chain",
      `<p>Your mastery of timing and aggression lets you chain your strikes across the ring. When you reduce a creature to 0 Hit Points with an attack from Flurry of Blows or with Rhythm of the Ring, you can make one additional Flurry of Blows against another creature within your reach without expending a Focus Point. You can use this feature only once on each of your turns.</p>
     `]
    ]
  },
 ]
};
