 kind:"class", slug:"barbarian", name:"Barbarian", color:"#b56906",

 intro:["Barbarians are mighty warriors who are powered by primal forces of the multiverse that manifest as a Rage. More than a mere emotion—and not limited to anger—this Rage is an incarnation of a predator’s ferocity, a storm’s fury, and a sea’s turmoil. Some Barbarians personify their Rage as a fierce spirit or revered forebear. Others see it as a connection to the pain and anguish of the world, as an impersonal tangle of wild magic, or as an expression of their own deepest self. For every Barbarian, their Rage is a power that fuels not just battle prowess, but also uncanny reflexes and heightened senses. Barbarians often serve as protectors and leaders in their communities. They charge headlong into danger so those under their protection don’t have to. Their courage in the face of danger makes Barbarians perfectly suited for adventure."],
 core:[["Primary Ability","Strength"],["Hit Point Die","D12 per Barbarian level"],["Saving Throw Proficiencies","Strength and Constitution"],["Skill Proficiencies","Choose 2: Animal Handling, Athletics, Intimidation, Nature, Perception, or Survival"],["Weapon Proficiencies","Simple and Martial weapons"],["Armor Training","Light, Medium armor and Shields"]],
 features:[
  [1,"Rage",
  `<p>You can imbue yourself with a primal power called Rage, a force that grants you extraordinary might and resilience. You can enter it as a Bonus Action if you aren’t wearing Heavy armor.</p>
   <p>You can enter your Rage the number of times shown for your Barbarian level in the Rages column of the Barbarian Features table. You regain one expended use when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest.</p>
   <p>While active, your Rage follows the rules below.</p>
   <p><b><i>Damage Resistance. </i></b>You have Resistance to Bludgeoning, Piercing, and Slashing damage.</p>
   <p><b><i>Rage Damage. </i></b>When you make an attack using Strength—with either a weapon or an Unarmed Strike—and deal damage to the target, you gain a bonus to the damage that increases as you gain levels as a Barbarian, as shown in the Rage Damage column of the Barbarian Features table.<br></p>
   <p><b><i>Strength Advantage. </i></b>You have Advantage on Strength checks and Strength saving throws.</p>
   <p><b><i>No Concentration or Spells. </i></b>You can’t maintain Concentration, and you can’t cast spells.</p>
   <p><b><i>Duration. </i></b>The Rage lasts until the end of your next turn, and it ends early if you don Heavy armor or have the Incapacitated condition. If your Rage is still active on your next turn, you can extend the Rage for another round by doing one of the following:</p>
   <ul>
         <li>Make an attack roll against an enemy.</li>
         <li>Force an enemy to make a saving throw.</li>
         <li>Take a Bonus Action to extend your Rage.</li>
   </ul>
   <p>Each time the Rage is extended, it lasts until the end of your next turn. You can maintain a Rage for up to 10 minutes.</p>
   `],
  [1,"Unarmored Defense", "While you aren’t wearing any armor, your base Armor Class equals 10 plus your Dexterity and Constitution modifiers. You can use a Shield and still gain this benefit."],
  [1,"Weapon Mastery", "Your training with weapons allows you to use the mastery properties of two kinds of Simple or Martial Melee weapons of your choice. Whenever you finish a Long Rest, you can practice weapon drills and change one of those weapon choices. When you reach certain Barbarian levels, you gain the ability to use the mastery properties of more kinds of weapons, as shown in the Weapon Mastery column of the Barbarian Features table."],
  [2,"Danger Sense", "You gain an uncanny sense of when things aren’t as they should be, giving you an edge when you dodge perils. You have Advantage on Dexterity saving throws unless you have the Incapacitated condition."],
  [2,"Reckless Attack", "You can throw aside all concern for defense to attack with increased ferocity. When you make your first attack roll on your turn, you can decide to attack recklessly. Doing so gives you Advantage on attack rolls using Strength until the start of your next turn, but attack rolls against you have Advantage during that time."],
  [3,"Barbarian Subclass","You gain a Barbarian subclass of your choice. A subclass is a specialization that grants you features at certain Barbarian levels. For the rest of your career, you gain each of your subclass’s features that are of your Barbarian level or lower."],
  [3,"Primal Knowledge","You gain proficiency in another skill of your choice from the skill list available to Barbarians at level 1. In addition, while your Rage is active, you can channel primal power when you attempt certain tasks; whenever you make an ability check using one of the following skills, you can make it as a Strength check even if it normally uses a different ability: Acrobatics, Intimidation, Perception, Stealth, or Survival. When you use this ability, your Strength represents primal power coursing through you, honing your agility, bearing, and senses."],
  [4,"Ability Score Improvement", "You gain the Ability Score Improvement feat or another feat of your choice for which you qualify. You gain this feature again at Barbarian levels 8, 12, and 16."],
  [5,"Extra Attack", "You can attack twice instead of once whenever you take the Attack action on your turn."],
  [5,"Fast Movement", "Your speed increases by 10 feet while you aren’t wearing Heavy armor."],
  [6,"Subclass Feature"],
  [7,"Feral Instinct", "Your instincts are so honed that you have Advantage on Initiative rolls."],
  [7,"Instinctive Pounce", "As part of the Bonus Action you take to enter your Rage, you can move up to half your Speed."],
  [8,"Ability Score Improvement"],
  [9,"Brutal Strike", 
   `<p>If you use Reckless Attack, you can forgo any Advantage on one Strength-based attack roll of your choice on your turn. The chosen attack roll mustn’t have Disadvantage. If the chosen attack roll hits, the target takes an extra 1d10 damage of the same type dealt by the weapon or Unarmed Strike, and you can cause one Brutal Strike effect of your choice. You have the following effect options.</p>
   <p><b><i>Forceful Blow. </i></b>The target is pushed 15 feet straight away from you. You can then move up to half your Speed straight toward the target without provoking Opportunity Attacks.</p>
   <p><b><i>Hamstring Blow. </i></b>The target’s Speed is reduced by 15 feet until the start of your next turn. A target can be affected by only one Hamstring Blow at a time—the most recent one.<br></p>
  `],
  [10,"Subclass Feature"],
  [11,"Relentless Rage",
    `<p>Your Rage can keep you fighting despite grievous wounds. If you drop to 0 Hit Points while your Rage is active and don’t die outright, you can make a DC 10 Constitution saving throw. If you succeed, your Hit Points instead change to a number equal to twice your Barbarian level.</p>
    <p>Each time you use this feature after the first, the DC increases by 5. When you finish a Short or Long Rest, the DC resets to 10.</p>
  `],
  [12,"Ability Score Improvement"],
  [13,"Improved Brutal Strike",
    `<p>You have honed new ways to attack furiously. The following effects are now among your Brutal Strike options.</p>

   <p><b><i>Sundering Blow. </i></b>Before the start of your next turn, the next attack roll made by another creature against the target gains a +5 bonus to the roll. An attack roll can gain only one Sundering Blow bonus.<br></p>
  `],
  [14,"Subclass Feature"],

    intro:["Bloodhounds are among those known as Those Who Ever-Thirst, devotees of the Flayed Twins. These two enigmatic entities are neither gods nor devils, but beings believed to originate from the Far Realms, beyond the known order of Ossyra."],
    features:[
     [3,"Bloodrage",
      `<p>When you enter your Rage, you can channel the hunger of the Flayed Twins, gaining the following benefits while your Rage lasts.</p>
      <p><b><i>Scent of Death. </i></b>The scent of blood sharpens your senses and draws you toward wounded prey.</p>
      <ul>
         <li><b><i>Blood Sense. </i></b>You know the exact location of any creature within 60 feet of you that has fewer than half its Hit Points, even if that creature is behind Total Cover or Invisible.</li>
         <li><b><i>Thirsting Speed. </i></b>Your Speed increases by 10 feet. This increase becomes 20 feet when you move toward a creature that has fewer than its maximum Hit Points.</li>
         <li><b><i>Hunter's Prerogative. </i></b> Once per turn when you hit a creature with a melee weapon attack and that creature has fewer than half its Hit Points, you deal an extra 1d6 damage. This extra damage increases to 1d10 when you reach Barbarian level 10.</li>
      </ul>
      <p><b><i>Maw of the Beast. </i></b>The Twins awaken a predatory hunger within you, transforming your bite into a weapon. While your Bloodrage is active, you can take a Bonus Action to make a bite attack against a creature within 5 feet of you. On a hit, the attack deals 1d6 piercing damage plus your Strength modifier, and you regain Hit Points equal to the damage dealt.</p>
    `],
     [6,"Desecrated Ground",
      `<p>You spill your own blood as an offering, allowing the Twins' influence to seep into the surrounding area. You take 2d6 necrotic damage and create a 20-foot-radius bloody mist centered on a point you can see within 30 feet of you.</p>
      <p>Other creatures that enter the mist for the first time on a turn or start their turn there must make a Constitution saving throw (DC 10 + your Proficiency Bonus + your Strength modifier). On a failed save, a creature takes 2d6 necrotic damage and is Silenced. On a successful save, it takes half as much damage but is still Silenced.</p>
      <p>The mist lasts for 1 minute. You cannot dismiss it.</p> 
     `],
     [10,"Curse of the Flayed Ones",
      `<p>You direct the Twins' attention toward a creature, marking it for their hunger. Choose one creature you can see within 60 feet of you. It must make a Constitution saving throw (DC 10 + your Proficiency Bonus + your Strength modifier).</p>
      <p>On a failed save, the creature takes 3d8 necrotic damage and becomes Blood-Cursed for 1 minute. Whenever the cursed creature moves, it takes 1d10 slashing damage for every 5 feet it travels. At the end of each of its turns, it can repeat the saving throw, provided it hasn't moved during that turn. On a successful save, the curse ends.</p>
      <p>On a successful initial save, the creature takes half as much damage and isn't cursed. The target is immune from the curse for 24 hours.</p>

     [14,"The Flayed Avatar",
      `<p>You become a vessel for the Flayed Twins' influence, your body radiating an unnatural hunger. While your Rage is active, you gain the following benefits:</p>
      <ul>
         <li>You have Resistance to necrotic damage.</li>
         <li>Whenever you reduce a creature to 0 Hit Points, you gain Temporary Hit Points equal to your Barbarian level + your Constitution modifier + your Proficiency Bonus.</li>
         <li>You radiate bloody vapor in a 5-foot Emanation. A creature that starts its turn within this area takes necrotic damage equal to your Constitution modifier + your Proficiency Bonus. You regain Hit Points equal to the necrotic damage dealt.</li>

     `]
